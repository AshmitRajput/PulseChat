services:
  # PostgreSQL database
  db:
    restart: unless-stopped
    image: postgres:16.2-alpine3.19
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    healthcheck:
      test: [ "CMD", "pg_isready", "-d", "postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Pub/Sub + presence (Phase 1)
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # FrontEnd + reverse proxy to app
  nginx:
    restart: unless-stopped
    image: nginx:1.25.4-alpine
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # FastApi
  app:
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    build:
      context: .
      dockerfile: backend/Dockerfile
    # No fixed host port anymore - two scaled containers can't both bind
    # 8000:8000. "expose" makes 8000 reachable to other containers on the
    # same Docker network (i.e. nginx) without publishing it to the host.
    # All access now goes through nginx on port 80.
    expose:
      - "8000"
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      